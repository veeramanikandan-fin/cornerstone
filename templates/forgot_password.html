{% extends "auth_base.html" %}

{% block title %}Forgot Password - Acme Productivity{% endblock %}
{% block auth_subtitle %}We'll send you a link to reset your password{% endblock %}

{% block content %}
<form action="{{ url_for('forgot_password') }}" method="post" class="space-y-4">
    <div class="space-y-2">
        <label for="email" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Email</label>
        <input type="email" id="email" name="email" class="shad-input" placeholder="m@example.com" required>
    </div>
    <button type="submit" class="shad-button-primary mt-2">Send Reset Link</button>
</form>

<div class="mt-4 text-center text-sm">
    <a href="{{ url_for('login') }}" class="underline underline-offset-4 hover:text-primary">Back to login</a>
</div>
{% endblock %}
