<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do List</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 2em auto;
            padding: 1em;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        form {
            display: flex;
            margin-bottom: 1em;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 0.5em;
            font-size: 1em;
            border: 1px solid #ccc;
        }
        button {
            padding: 0.5em 1em;
            font-size: 1em;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            display: flex;
            align-items: center;
            background: white;
            margin-bottom: 0.5em;
            padding: 0.5em;
            border: 1px solid #ddd;
        }
        li.done .title {
            text-decoration: line-through;
            color: #888;
        }
        .title {
            flex-grow: 1;
            margin-left: 0.5em;
        }
        .actions form {
            margin: 0;
            display: inline;
        }
        .actions button {
            background-color: #dc3545;
            padding: 0.25em 0.5em;
            font-size: 0.9em;
        }
        .actions button:hover {
            background-color: #c82333;
        }
        .toggle-btn {
            background-color: #28a745;
            padding: 0.25em 0.5em;
            font-size: 0.9em;
        }
        .toggle-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <h1>To-Do List</h1>
    <form action="{{ url_for('add') }}" method="post">
        <input type="text" name="title" placeholder="Add a new task..." required>
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li class="{% if task.done %}done{% endif %}">
                <form action="{{ url_for('toggle', task_id=task.id) }}" method="post" style="margin: 0;">
                    <button type="submit" class="toggle-btn" style="background: none; border: none; font-size: 1.5em; padding: 0; cursor: pointer; color: {% if task.done %}green{% else %}gray{% endif %};">
                        {% if task.done %}☑{% else %}☐{% endif %}
                    </button>
                </form>
                <span class="title">{{ task.title }}</span>
                <div class="actions">
                    <form action="{{ url_for('delete', task_id=task.id) }}" method="post">
                        <button type="submit">Delete</button>
                    </form>
                </div>
            </li>
        {% else %}
            <li>No tasks yet. Add one above!</li>
        {% endfor %}
    </ul>
</body>
</html>
