{% extends "auth_base.html" %}

{% block title %}Log In - Acme Productivity{% endblock %}
{% block auth_subtitle %}Enter your email to sign in to your account{% endblock %}

{% block content %}
<form action="{{ url_for('login') }}" method="post" class="space-y-4">
    <div class="space-y-2">
        <label for="email" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Email</label>
        <input type="email" id="email" name="email" class="shad-input" placeholder="m@example.com" required>
    </div>
    <div class="space-y-2">
        <div class="flex items-center justify-between">
            <label for="password" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">Password</label>
            <a href="{{ url_for('forgot_password') }}" class="text-sm font-medium text-primary underline-offset-4 hover:underline">Forgot password?</a>
        </div>
        <input type="password" id="password" name="password" class="shad-input" required>
    </div>
    <button type="submit" class="shad-button-primary mt-2">Sign In</button>
</form>

<div class="mt-4 text-center text-sm">
    Don't have an account?
    <a href="{{ url_for('signup') }}" class="underline underline-offset-4 hover:text-primary">Sign up</a>
</div>
{% endblock %}
