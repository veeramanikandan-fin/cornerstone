{% extends "base.html" %}

{% block title %}Pomodoro Timer - Acme Productivity{% endblock %}

{% block extra_css %}
<style>
    .timer-display {
        font-size: 6rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        letter-spacing: -0.05em;
        background: -webkit-linear-gradient(45deg, hsl(var(--primary)), hsl(var(--muted-foreground)));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
</style>
{% endblock %}

{% block content %}
<div class="flex items-center justify-between space-y-2 mb-8">
    <div>
        <h2 class="text-2xl font-bold tracking-tight">Focus Timer</h2>
        <p class="text-muted-foreground">Boost your productivity using the Pomodoro technique.</p>
    </div>
</div>

<div class="flex items-center justify-center min-h-[500px]">
    <div class="shad-card w-full max-w-md p-8 flex flex-col items-center justify-center space-y-8 text-center bg-card">

        <!-- Mode Tabs -->
        <div class="inline-flex h-10 items-center justify-center rounded-md bg-muted p-1 text-muted-foreground">
            <button class="inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 mode-btn active:bg-background active:text-foreground active:shadow-sm" id="btn-pomodoro" onclick="setMode('pomodoro')">Pomodoro</button>
            <button class="inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 mode-btn" id="btn-shortBreak" onclick="setMode('shortBreak')">Short Break</button>
            <button class="inline-flex items-center justify-center whitespace-nowrap rounded-sm px-3 py-1.5 text-sm font-medium ring-offset-background transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 mode-btn" id="btn-longBreak" onclick="setMode('longBreak')">Long Break</button>
        </div>

        <!-- Timer -->
        <div class="py-12">
            <div class="timer-display" id="time-display">25:00</div>
        </div>

        <!-- Controls -->
        <div class="flex items-center justify-center space-x-4 w-full">
            <button class="shad-button shad-button-primary h-12 px-8 text-lg font-semibold shadow-sm flex-1" id="start-btn" onclick="toggleTimer()">START</button>
            <button class="shad-button shad-button-outline h-12 w-12 p-0" onclick="resetTimer()" title="Reset Timer">
                <i data-lucide="refresh-cw" class="h-5 w-5"></i>
                <span class="sr-only">Reset</span>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let timer;
    let isRunning = false;
    let currentMode = 'pomodoro';

    const modes = {
        pomodoro: 25 * 60,
        shortBreak: 5 * 60,
        longBreak: 15 * 60
    };

    let timeRemaining = modes[currentMode];

    const display = document.getElementById('time-display');
    const startBtn = document.getElementById('start-btn');
    const modeBtns = document.querySelectorAll('.mode-btn');

    function updateDisplay() {
        const minutes = Math.floor(timeRemaining / 60);
        const seconds = timeRemaining % 60;
        display.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        document.title = `${display.textContent} - Pomodoro`;
    }

    function setMode(mode) {
        if (isRunning) return; // Prevent changing mode while running

        currentMode = mode;
        timeRemaining = modes[currentMode];

        // Update buttons UI (mimicking tabs)
        modeBtns.forEach(btn => {
            btn.classList.remove('bg-background', 'text-foreground', 'shadow-sm');
        });
        document.getElementById(`btn-${mode}`).classList.add('bg-background', 'text-foreground', 'shadow-sm');

        updateDisplay();
    }

    function toggleTimer() {
        if (isRunning) {
            clearInterval(timer);
            startBtn.textContent = 'START';
            startBtn.classList.remove('bg-destructive', 'text-destructive-foreground', 'hover:bg-destructive/90');
            startBtn.classList.add('shad-button-primary');
        } else {
            timer = setInterval(() => {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    updateDisplay();
                } else {
                    clearInterval(timer);
                    isRunning = false;
                    startBtn.textContent = 'START';
                    alert('Time is up!');
                }
            }, 1000);
            startBtn.textContent = 'PAUSE';
            startBtn.classList.remove('shad-button-primary');
            startBtn.classList.add('bg-destructive', 'text-destructive-foreground', 'hover:bg-destructive/90');
        }
        isRunning = !isRunning;
    }

    function resetTimer() {
        clearInterval(timer);
        isRunning = false;
        timeRemaining = modes[currentMode];
        updateDisplay();
        startBtn.textContent = 'START';
        startBtn.classList.remove('bg-destructive', 'text-destructive-foreground', 'hover:bg-destructive/90');
        startBtn.classList.add('shad-button-primary');
    }

    // Initialize display and UI
    setMode('pomodoro');
</script>
{% endblock %}
