{% extends "auth_base.html" %}

{% block title %}Reset Password - Acme Productivity{% endblock %}
{% block auth_subtitle %}Enter your new password below{% endblock %}

{% block content %}
<form action="" method="post" class="space-y-4">
    <div class="space-y-2">
        <label for="password" class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70">New Password</label>
        <input type="password" id="password" name="password" class="shad-input" required>
    </div>
    <button type="submit" class="shad-button-primary mt-2">Reset Password</button>
</form>

<div class="mt-4 text-center text-sm">
    <a href="{{ url_for('login') }}" class="underline underline-offset-4 hover:text-primary">Back to login</a>
</div>
{% endblock %}
